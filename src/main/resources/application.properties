spring.application.name=ai-medical
server.port=8081

# ===== MongoDB：聊天记忆持久化 =====
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/chat_memory_db}

# ===== MySQL：预约挂号数据 =====
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/medical?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml

# ===== 通义千问：对话模型（阿里云百炼 DashScope） =====
langchain4j.community.dashscope.chat-model.api-key=${DASH_SCOPE_API_KEY}
langchain4j.community.dashscope.chat-model.model-name=qwen-plus

# ===== 通义千问：流式对话模型 =====
langchain4j.community.dashscope.streaming-chat-model.api-key=${DASH_SCOPE_API_KEY}
langchain4j.community.dashscope.streaming-chat-model.model-name=qwen-plus

# ===== 通义千问：向量化模型 =====
langchain4j.community.dashscope.embedding-model.api-key=${DASH_SCOPE_API_KEY}
langchain4j.community.dashscope.embedding-model.model-name=text-embedding-v3

# ===== OCR：Tesseract =====
tesseract.language=chi_sim+eng
tesseract.datapath=classpath:tessdata/

# ===== Pinecone 向量数据库 =====
pinecone.index-name=medical-index1
pinecone.namespace=medical-namespace1
pinecone.cloud=AWS
pinecone.region=us-east-1

# ===== PDF 工具输出目录 =====
pdf.output-dir=${PDF_OUTPUT_DIR:./output/pdf}

# ===== Knife4j 接口文档 =====
springdoc.swagger-ui.path=/swagger-ui.html
knife4j.enable=true

# 打印 LangChain4j 请求/响应及 Token 消耗，便于调试；生产环境建议调为 INFO
logging.level.dev.langchain4j=DEBUG
